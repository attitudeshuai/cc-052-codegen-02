services:
  api:
    build: .
    container_name: cc-052-codegen-02-api
    ports:
      - "9062:8090"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: farm
      DB_PASSWORD: farm_secret
      DB_NAME: farm_trace
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:19010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: farm-trace
      MINIO_USE_SSL: "false"
      SERVER_PORT: "8090"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - farm-network

  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: cc-052-codegen-02-db
    ports:
      - "15443:5432"
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm_secret
      POSTGRES_DB: farm_trace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm_trace"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - farm-network

  cache:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: cc-052-codegen-02-cache
    ports:
      - "16390:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - farm-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: cc-052-codegen-02-minio
    ports:
      - "19010:9000"
      - "19011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - farm-network

volumes:
  pgdata:
  miniodata:
  redisdata:

networks:
  farm-network:
    driver: bridge
